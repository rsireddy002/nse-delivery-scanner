name: Daily delivery snapshot

on:
  schedule:
    # 19:30 IST = 14:00 UTC, Mon-Fri
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas requests pyarrow

      - name: Fetch bhavcopy
        run: python precompute.py

      - name: Fetch F&O open interest
        run: python precompute_oi.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/delivery_latest.parquet data/delivery_meta.json data/oi_latest.parquet data/oi_meta.json
          if git diff --staged --quiet; then
            echo "No new data - nothing to commit"
          else
            git commit -m "daily snapshot $(date +%d-%b)"
            git push
          fi
